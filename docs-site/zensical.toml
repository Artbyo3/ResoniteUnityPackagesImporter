[project]
site_name = "Unity Package Importer"
site_description = "Project status, compatibility notes, and documentation for the Unity Package Importer for Resonite."
site_url = "https://artbyo3.github.io/ResoniteUnityPackagesImporter/"
repo_url = "https://github.com/Artbyo3/ResoniteUnityPackagesImporter"
docs_dir = "pages"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Documentation" = "documentation/index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
  ] },
  { "Importing concepts" = [
    "importing/avatars.md",
    "importing/clothing.md",
    "importing/companion-packages.md",
  ] },
  { "Compatibility" = [
    "reference/compatibility/index.md",
    "reference/compatibility/unity-packages.md",
    "reference/compatibility/modular-avatar.md",
    "reference/compatibility/vrcfury.md",
    { "Shaders and materials" = [
      "reference/compatibility/shaders/index.md",
      "reference/compatibility/shaders/standard.md",
      "reference/compatibility/shaders/liltoon.md",
      "reference/compatibility/shaders/poiyomi.md",
    ] },
    "reference/troubleshooting.md",
  ] },
  { "Legal" = [
    "legal/index.md",
    "legal/third-party-notices.md",
  ] },
]

extra_css = ["stylesheets/notice.css", "stylesheets/branding.css", "stylesheets/landing-v2.css"]
extra_javascript = ["javascripts/avatar-comparison.js", "javascripts/contributors-v2.js", "javascripts/landing-video.js"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}

[project.theme]
custom_dir = "overrides"
features = ["navigation.sections", "navigation.path", "search.highlight"]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
primary = "teal"
accent = "teal"

[project.extra]
alternate = [
  { name = "English", link = "", lang = "en" },
  { name = "日本語", link = "ja/", lang = "ja" },
]

