name: Public project update
description: Draft a short project-status update for the documentation.
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        This is a draft, not an automatically published update. After reviewing the copy, a maintainer adds `project-status` and exactly one `status:*` label. Do not paste logs, personal details or private asset names into the public fields.
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: One or two short plain-text sentences about the user impact. No logs or markup.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Next step
      description: One or two short plain-text sentences describing the actual next action, not an invented delivery date.
    validations:
      required: true
