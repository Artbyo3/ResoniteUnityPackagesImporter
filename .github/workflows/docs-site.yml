name: Documentation site

on:
  push:
    branches:
      - master
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the reviewed site to GitHub Pages"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

concurrency:
  group: documentation-site
  cancel-in-progress: true

jobs:
  build:
    name: Check documentation build
    if: ${{ github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'project-status') || github.event.label.name == 'project-status' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install site generator
        run: python -m pip install -r docs-site/requirements.txt
      - name: Test documentation content and rendering
        run: python -m unittest discover -s docs-site/tests
      - name: Build site
        working-directory: docs-site
        run: python build.py

      - name: Refresh public project status from GitHub Issues
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs-site/sync_project_status.py
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        with:
          path: docs-site/site

  publish:
    name: Publish to GitHub Pages
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
