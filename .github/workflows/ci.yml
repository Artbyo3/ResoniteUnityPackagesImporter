name: Regression tests

on:
  push:
    branches:
      - master
      - "dev/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Standalone regression test suite (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run standalone regression test suite
        run: dotnet run --project Tests/Importer.RegressionTests.csproj -c Release
