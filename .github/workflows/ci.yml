name: Regression tests

on:
  push:
    branches:
      - master
      - "dev/**"
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Standalone regression test suite (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run standalone regression test suite
        run: dotnet run --project Tests/Importer.RegressionTests.csproj -c Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        run: python -m unittest discover -s Tests -p "test_*.py"
